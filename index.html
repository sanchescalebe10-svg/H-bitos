<style>
:root{--bg:#000;--s1:rgba(255,255,255,.055);--s2:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);--tx:#e8ecf2;--mu:#9b95ae;--ac:#ff3d4f;--acd:rgba(255,61,79,.13);--ok:#2ee6a6;--warn:#ffb84d;--bad:#ff6b7a;--hf:'Sora',system-ui,sans-serif;--bf:'Figtree',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--bf);min-height:100vh}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}

.logo{font:700 20px var(--hf);padding:0 10px 18px;display:flex;align-items:center;gap:9px}.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--ac),#b3122a);display:inline-block}
.ni{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mu);font-weight:500;transition:.2s;text-align:left;width:100%}
.ni:hover{background:var(--s2);color:var(--tx)}.ni.on{background:var(--acd);color:var(--ac)}.ni svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.bn,.pop{display:none}

.mu,small{color:var(--mu)}small{font-size:13px}.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}

@keyframes pop{40%{transform:scale(1.28);box-shadow:0 0 0 10px rgba(46,230,166,.18)}}@keyframes grow{from{width:0}}
.row.ok .gr b{text-decoration:line-through;color:var(--mu)}.off{opacity:.55}
.pb{height:8px;border-radius:8px;background:var(--s2);overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#b3122a);border-radius:8px;animation:grow .8s ease-out}
.ring{position:relative;width:150px;height:150px;flex:none}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:11;stroke-linecap:round}.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:700 30px var(--hf)}

.bars{display:flex;gap:6px;align-items:flex-end;height:150px}.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;align-items:center;min-width:0}.bar i{width:100%;background:var(--acd);border-top:3px solid var(--ac);border-radius:6px 6px 2px 2px;min-height:3px;transition:.2s;animation:up .7s}.bar:hover i{background:var(--ac)}.bar span{font-size:11px;color:var(--mu)}

label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips label{margin:0;display:inline-block}.chips input{display:none}.chips span{display:inline-block;padding:6px 11px;border-radius:10px;border:1px solid var(--line);color:var(--mu);cursor:pointer;font-size:13px;user-select:none}.chips input:checked+span{background:var(--acd);border-color:var(--ac);color:var(--ac)}

.dc{aspect-ratio:1;border-radius:11px;border:1px solid var(--line);font-size:13px;position:relative;transition:.15s}.dc:hover{border-color:var(--ac)}
.dc.full{background:var(--ac);color:#fff;font-weight:700}.dc.part{background:var(--acd);border-color:var(--ac)}.dc.miss::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--bad)}.dc.fut{color:var(--mu);opacity:.5}.dc.td{box-shadow:0 0 0 2px var(--warn)}.dc.sel{outline:2px solid var(--tx)}
.mini .dc{font-size:11px;border-radius:8px}

.mb{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto}
.isel{display:flex;gap:6px;flex-wrap:wrap}.isel input{display:none}.isel span{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;font-size:18px}.isel input:checked+span{border-color:var(--ac);background:var(--acd)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--s2);border:1px solid var(--ac);padding:10px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
.av{width:44px;height:44px;border-radius:50%;background:var(--acd);color:var(--ac);display:grid;place-items:center;font:700 18px var(--hf);overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.sw{position:relative;width:44px;height:24px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}.sw b{position:absolute;inset:0;border-radius:20px;background:var(--s2);border:1px solid var(--line);transition:.2s}.sw b::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--mu);transition:.2s}.sw input:checked+b{background:var(--acd);border-color:var(--ac)}.sw input:checked+b::after{left:22px;background:var(--ac)}
@media(max-width:820px){.app{display:block}aside{display:none}main{padding:18px 14px 100px}h1{font-size:22px}.g2,.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}
.bn{display:flex;position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;justify-content:space-around}
.bn .ni{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;width:auto;flex:1;align-items:center}.pop.open{display:block;position:fixed;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:8px;z-index:45;width:190px}

.btn:hover{box-shadow:0 6px 22px rgba(255,61,79,.28)}
.gc .card,.ach.card{transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .28s,box-shadow .28s}.gc .card:hover{transform:translateY(-3px);border-color:rgba(255,61,79,.35);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.row{transition:background .2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.vin .hd,.vin .card,.vin .empty{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}.vin .card:nth-child(2){animation-delay:.07s}.vin .card:nth-child(3){animation-delay:.14s}.vin .card:nth-child(4){animation-delay:.21s}.vin .card:nth-child(n+5){animation-delay:.28s}
@keyframes ringin{from{stroke-dashoffset:402}}.ring circle:last-child{animation:ringin 1.2s .2s cubic-bezier(.3,.7,.2,1) backwards}

#modal.open{animation:fade .25s}#modal.open .mb{animation:mIn .35s cubic-bezier(.2,.8,.2,1)}
#ld{position:fixed;inset:0;z-index:100;background:radial-gradient(60% 50% at 50% 40%,rgba(255,61,79,.13),transparent),var(--bg);display:grid;place-items:center;transition:transform 1s cubic-bezier(.76,0,.24,1)}#ld.lift{transform:translateY(-100%)}#ld::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ac),transparent);opacity:0;transition:opacity .3s}#ld.lift::after{opacity:.6}
.ldc{text-align:center}.ldm{width:96px;height:96px;overflow:visible;filter:drop-shadow(0 0 14px rgba(255,61,79,.35))}.ldo{transform-origin:40px 40px;animation:spin 1.4s linear infinite}.ldn{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1s .2s ease-out forwards}
.ldw{font:700 38px var(--hf);margin-top:14px;display:flex;justify-content:center}.ldw span{opacity:0;animation:lt .6s both}
.ldc p{color:var(--mu);margin:6px 0 0;letter-spacing:.16em;font-size:13px;opacity:0;animation:fin .8s 1.1s forwards}
.ldb{width:160px;height:3px;border-radius:3px;background:var(--s2);margin:26px auto 0;overflow:hidden}.ldb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#b3122a);transform-origin:left;animation:load 6s cubic-bezier(.45,0,.2,1) forwards}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes lt{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}@keyframes fin{to{opacity:1}}@keyframes load{from{transform:scaleX(0)}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}.top .brand{display:none;align-items:center;gap:8px;font:700 22px var(--hf)}.top .r{display:flex;gap:8px;margin-left:auto}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--s1);border-radius:22px;padding:7px 14px;font-weight:600}.av0{padding:0;border-radius:50%}.top .av{width:38px;height:38px;font-size:15px}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:30px;padding:4px;margin-bottom:14px}.seg button{flex:1;padding:8px 4px;border-radius:26px;color:var(--mu);font-weight:500;transition:.3s}.seg button.on{background:var(--ac);color:#fff;font-weight:600;box-shadow:0 4px 16px rgba(255,61,79,.3)}
.dp{font-size:13px;font-weight:600;padding:3px 9px;border-radius:9px;background:var(--acd);color:var(--ac);white-space:nowrap}.dp.dn{background:rgba(255,107,122,.14);color:var(--bad)}.up{color:var(--ok)}
.cw,.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.num small{font:500 14px var(--bf);color:var(--mu)}
.svg{width:100%;height:auto;display:block;overflow:visible;margin-top:10px}.gl{stroke:var(--line)}.yt,.xt{fill:var(--mu);font-size:10px}.avl{stroke:var(--warn);stroke-dasharray:3 4;opacity:.6}.bg{cursor:pointer}

.ins{padding:13px}.ins .num{font-size:22px}.ins>small{display:block}.am{font:600 15px var(--hf);color:var(--warn);display:block;overflow-wrap:anywhere}.lg{display:flex;flex-direction:column;gap:2px;min-width:0}.lg small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}

.lds{display:block;margin-top:14px;min-height:18px}

/* ===== deslizar (dedo, mouse ou trackpad) para trocar de tela ===== */
let keepMain=false,PK=document.createElement('main');
PK.id='peek';PK.setAttribute('aria-hidden','true');document.querySelector('.app').appendChild(PK);
const SW={x:0,y:0,t:0,dx:0,mw:0,axis:'off',busy:false,pk:-1,id:null};
const swOff=()=>SW.busy||!!$('#ld')||$('#modal').classList.contains('open');
const swIdx=()=>NAV.findIndex(n=>n[0]===cur);
let eatClick=false;
document.addEventListener('click',e=>{if(eatClick){eatClick=false;e.stopPropagation();e.preventDefault()}},true);
function swHide(){PK.style.cssText='';PK.innerHTML='';SW.pk=-1}
function swFinish(to){
  const old=$('#main'),nw=PK;
  old.id='peek';nw.id='main';
  old.style.cssText='';old.innerHTML='';old.setAttribute('aria-hidden','true');
  nw.style.cssText='';nw.removeAttribute('aria-hidden');
  PK=old;SW.pk=-1;
  mo=false;$('#pop').className='pop';
  cur=NAV[to][0];
  keepMain=true;render();keepMain=false;
  SW.busy=false;
}
function swEnd(){
  if(SW.axis!=='x')return;
  SW.axis='off';document.body.classList.remove('swiping');
  const m=$('#main'),dx=SW.dx,d=dx<0?1:-1,to=swIdx()+d,v=Math.abs(dx)/Math.max(1,Date.now()-SW.t),
    ok=to>=0&&to<NAV.length,ease='transform .26s cubic-bezier(.2,.8,.2,1),opacity .26s';
  if(Math.abs(dx)>10){eatClick=true;setTimeout(()=>{eatClick=false},350)}
  if(!ok||!(Math.abs(dx)>SW.mw*.2||(Math.abs(dx)>40&&v>.5))){
    m.style.transition=ease;m.style.transform='';m.style.opacity='';
    if(ok){PK.style.transition=ease;PK.style.transform=`translateX(${d*SW.mw}px)`}
    setTimeout(()=>{if(SW.axis!=='x'&&!SW.busy){swHide();m.style.transition=''}},280);
    return;
  }
  SW.busy=true;
  m.style.transition=ease;m.style.transform=`translateX(${-d*SW.mw}px)`;m.style.opacity='';
  PK.style.transition=ease;PK.style.transform='translateX(0px)';
  scrollTo({top:0,behavior:'smooth'});
  setTimeout(()=>swFinish(to),270);
}
document.addEventListener('pointerdown',e=>{
  if(SW.axis==='x'){SW.dx=0;swEnd()}
  if(!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0)||swOff()||e.target.closest?.('input,select,textarea,[contenteditable]')){SW.axis='off';return}
  Object.assign(SW,{id:e.pointerId,x:e.clientX,y:e.clientY,t:Date.now(),dx:0,mw:$('#main').offsetWidth,axis:''});
});
document.addEventListener('pointermove',e=>{
  if(SW.id===null||e.pointerId!==SW.id||SW.axis==='off'||SW.busy||(e.pointerType==='mouse'&&!e.buttons))return;
  const dx=e.clientX-SW.x,dy=e.clientY-SW.y;
  if(!SW.axis){
    if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
    SW.axis=Math.abs(dx)>Math.abs(dy)*1.5?'x':'y';
    if(SW.axis==='x')document.body.classList.add('swiping');
  }
  if(SW.axis!=='x')return;
  SW.dx=dx;
  const m=$('#main'),d=dx<0?1:-1,to=swIdx()+d;
  m.style.transition='none';
  if(to<0||to>=NAV.length){swHide();m.style.transform=`translateX(${dx*.25}px)`;m.style.opacity='';return}
  if(SW.pk!==to){PK.innerHTML=topbar()+V[NAV[to][0]]();icons(PK);SW.pk=to}
  PK.style.cssText=`display:block;left:${m.offsetLeft}px;width:${m.offsetWidth}px;transition:none;transform:translateX(${dx+d*SW.mw}px)`;
  m.style.transform=`translateX(${dx}px)`;
  m.style.opacity=String(1-Math.min(Math.abs(dx)/SW.mw,1)*.25);
},{passive:true});
document.addEventListener('pointerup',e=>{if(e.pointerId===SW.id){SW.id=null;swEnd()}});
document.addEventListener('pointercancel',e=>{if(e.pointerId===SW.id){SW.id=null;SW.dx=0;swEnd()}});
/* trackpad: deslize horizontal de dois dedos */
let wh={acc:0,t:0,fired:false};
document.addEventListener('wheel',e=>{
  if(swOff()||SW.axis==='x'||!e.deltaX||Math.abs(e.deltaX)<Math.abs(e.deltaY)*1.5)return;
  const now=Date.now();
  if(now-wh.t>250){wh.acc=0;wh.fired=false}
  wh.t=now;
  if(wh.fired)return;
  wh.acc+=e.deltaX;
  if(Math.abs(wh.acc)>60){
    const to=swIdx()+(wh.acc>0?1:-1);wh.fired=true;
    if(to>=0&&to<NAV.length)A.go({dataset:{v:NAV[to][0]}});
  }
},{passive:true});
let FRESH='',SEGANIM=false,CALDIR=0;
function flip(fn){
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches,was=new Map();
  if(!rm)document.querySelectorAll('#main [data-hid]').forEach(e=>was.set(e.dataset.hid,e.getBoundingClientRect()));
  fn();
  if(rm)return;
  document.querySelectorAll('#main [data-hid]').forEach(e=>{
    const o=was.get(e.dataset.hid);if(!o)return;
    const n=e.getBoundingClientRect(),dx=o.left-n.left,dy=o.top-n.top;
    if(Math.abs(dx)+Math.abs(dy)>1)e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:340,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}
render.v='home';xpBoot();render();
/* ===== abertura: carregamento → saudação letra por letra → primeira tela sobe de baixo pra cima ===== */
(function intro(){
  const ld=$('#ld'),hg=$('#hg'),hgt=$('#hgt'),bn=$('#bn'),h=new Date().getHours(),
    gr=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite',nm=(S.settings.name||'').trim(),txt=nm?`${gr}, ${nm}`:gr;
  let k=0;
  hgt.setAttribute('aria-label',txt);
  hgt.innerHTML=txt.split(' ').map(w=>`<span class="hw">${[...w].map(c=>`<span class="hgl" aria-hidden="true" style="--d:${(k++*.05).toFixed(2)}s">${esc(c)}</span>`).join('')}</span>`).join(' ');
  const T0=6000,on=T0+700,typed=Math.max(0,k-1)*50+600,hold=900,T1=on+typed+hold+550;
  setTimeout(()=>ld.classList.add('out'),T0);                       // o carregamento sobe e some
  setTimeout(()=>hg.classList.add('on'),on);                        // saudação entra letra por letra
  setTimeout(()=>hg.classList.add('out'),on+typed+hold);            // saudação sobe e some
  setTimeout(()=>{ld.classList.add('lift');viewIn('boot');bn?.classList.add('boot')},T1); // cortina sobe revelando a tela
  setTimeout(()=>ld.remove(),T1+1050);
  setTimeout(()=>{$('#main').classList.remove('boot');bn?.classList.remove('boot')},T1+1400);
})();
</script></body></html>
